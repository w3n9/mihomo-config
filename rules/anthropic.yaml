# 通用 Mihomo 配置片段；客户端的合并语法由构建脚本生成。
proxy-groups:
  - name: Anthropic
    type: select
    filter: ".+static-.+"

# 仅这些域名的 DNS 经 Anthropic 当前所选节点发往 Cloudflare DoH。
# Anthropic 组需选择美国落地节点；其他域名继续使用订阅的 DNS。
dns:
  nameserver-policy:
    "+.anthropic.com": &anthropic-doh "https://1.1.1.1/dns-query#Anthropic"
    "+.claude.ai": *anthropic-doh
    "+.claude.com": *anthropic-doh
    "+.clau.de": *anthropic-doh
    "+.claudemcpclient.com": *anthropic-doh
    "+.claudemcpcontent.com": *anthropic-doh
    "+.claudeusercontent.com": *anthropic-doh
    "servd-anthropic-website.b-cdn.net": *anthropic-doh
    "anthropic.com.cdn.cloudflare.net": *anthropic-doh
    "anthropic.auth0.com": *anthropic-doh
    "anthropic-com.ghost.io": *anthropic-doh
    "+.sentry.io": *anthropic-doh
    "+.statsigapi.net": *anthropic-doh
    "browser-intake-us5-datadoghq.com": *anthropic-doh
    # DOMAIN-KEYWORD 无法直接用 DNS 域名通配表达，列出已知服务域名。
    "+.datadog.com": *anthropic-doh
    "+.datadoghq.com": *anthropic-doh
    "+.datadoghq.eu": *anthropic-doh
    "+.sift.com": *anthropic-doh
    "+.siftscience.com": *anthropic-doh
    "+.intercom.io": *anthropic-doh
    "+.intercomcdn.com": *anthropic-doh
    "cdn.usefathom.com": *anthropic-doh
    # 检测站自身、随机 DNS 探测域名及页面使用的 STUN 服务。
    "+.ip.net.coffee": *anthropic-doh
    "stun.l.google.com": *anthropic-doh
    "stun.cloudflare.com": *anthropic-doh

rules:
  # WebRTC 向 STUN 服务器发 UDP，不会携带发起页面的域名。
  # 覆盖检测页的 19302 / 3478 及常用的 5349；同时匹配 IPv4 / IPv6。
  # 节点未启用 UDP 时 Mihomo 会继续向下匹配，必须紧接 REJECT 防止换出口。
  - AND,((NETWORK,UDP),(DST-PORT,3478/5349/19302)),Anthropic
  - AND,((NETWORK,UDP),(DST-PORT,3478/5349/19302)),REJECT
  ## 参考自https://ip.net.coffee/claude/site.html
  # 核心域名
  - DOMAIN-SUFFIX,anthropic.com,Anthropic
  - DOMAIN-SUFFIX,claude.ai,Anthropic
  - DOMAIN-SUFFIX,claude.com,Anthropic
  - DOMAIN-SUFFIX,clau.de,Anthropic
  - DOMAIN-SUFFIX,claudemcpclient.com,Anthropic
  - DOMAIN-SUFFIX,claudemcpcontent.com,Anthropic
  - DOMAIN-SUFFIX,claudeusercontent.com,Anthropic
  # CDN 和静态资源
  - DOMAIN,servd-anthropic-website.b-cdn.net,Anthropic
  - DOMAIN,anthropic.com.cdn.cloudflare.net,Anthropic
  # 认证 / 内容
  - DOMAIN,anthropic.auth0.com,Anthropic
  - DOMAIN,anthropic-com.ghost.io,Anthropic
  # 监控和遥测
  - DOMAIN-SUFFIX,sentry.io,Anthropic
  - DOMAIN-SUFFIX,statsigapi.net,Anthropic
  - DOMAIN,browser-intake-us5-datadoghq.com,Anthropic
  - DOMAIN-KEYWORD,datadog,Anthropic
  - DOMAIN-KEYWORD,sift,Anthropic
  # 客服 / 第三方 widget
  - DOMAIN-SUFFIX,intercom.io,Anthropic
  - DOMAIN-SUFFIX,intercomcdn.com,Anthropic
  - DOMAIN,cdn.usefathom.com,Anthropic
  # 检测站和 DNS 探测请求同样走落地，兼容 fake-ip / SOCKS5 远端解析。
  - DOMAIN-SUFFIX,ip.net.coffee,Anthropic
  # IP 段 / ASN 兜底
  - IP-CIDR,160.79.104.0/21,Anthropic,no-resolve
  - IP-CIDR6,2607:6bc0::/32,Anthropic,no-resolve
  - IP-ASN,399358,Anthropic,no-resolve
